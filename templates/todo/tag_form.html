{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
{% block content %}
  <h1>{% if object %}Update Tag{% else %}Create new tag{% endif %}</h1>
  <form method="post" class="mt-4">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-info">Update</button>
  </form>
{% endblock %}
