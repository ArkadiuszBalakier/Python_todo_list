{% extends "base.html" %}
{% block content %}
  <h1>Tags</h1>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td><a href="#">Update</a></td>
          <td>
            <form method="post" action="{% url 'todo:tags-delete' tag.id %}">
              {% csrf_token %}
              <button class="btn btn-secondary">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

{% endblock %}
