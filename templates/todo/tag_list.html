{% extends "base.html" %}
{% block content %}
  <div class="d-flex align-items-center justify-content-between">
  <h1>Tags</h1>
  <form method="post" action="{% url 'todo:tags-create' %}">
    {% csrf_token %}
    <button class="btn btn-info">Add</button>
  </form>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody>
      {% for tag in tag_list %}
        <tr>
          <td>{{ tag.name }}</td>
          <td><a class="btn btn-secondary" href="{% url 'todo:tags-update' tag.id %}">Update</a></td>
          <td>
            <form method="post" action="{% url 'todo:tags-delete' tag.id %}">
              {% csrf_token %}
              <button class="btn btn-secondary">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>

{% endblock %}
